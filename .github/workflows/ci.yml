name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The Java versions to test come from endoflife.date, so a new LTS joins the
  # matrix without a change here. Only LTS releases from 21 upward count: 21 is
  # the toolchain in build.gradle.kts and the minimum the README promises.
  lts:
    name: lts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - name: List current Java LTS versions from 21 upward
        id: pick
        run: |
          fallback='["21","25"]'
          versions=$(curl -fsS --max-time 20 https://endoflife.date/api/eclipse-temurin.json \
            | jq -c '[.[] | select(.lts != false) | .cycle | select((tonumber? // 0) >= 21)] | sort_by(tonumber)') \
            || versions=''
          if [ -z "$versions" ] || [ "$versions" = '[]' ]; then
            echo "::warning::endoflife.date gave no usable answer, testing the committed list $fallback instead"
            versions=$fallback
          fi
          echo "Testing Java $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    name: build (Java ${{ matrix.java }})
    needs: lts
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      # Every leg must report on its own; cancelling the rest after one failure
      # would hide which Java versions still work.
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.lts.outputs.versions) }}
    steps:
      # The Ubuntu image leaves init.defaultBranch unset, so the git init inside
      # checkout prints a multi-line hint about 'master'. Setting it here only
      # names the throwaway initial branch; checkout still fetches the PR commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      # The toolchain compiles for 21 on every leg, so 21 has to be installed
      # next to the JDK under test. JAVA_HOME_21_X64 tells Gradle where it is.
      - name: Set up Java 21 for the toolchain
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
      - name: Build and run the tests on Java ${{ matrix.java }}
        env:
          TEST_JAVA_VERSION: ${{ matrix.java }}
        run: >
          ./gradlew build --no-daemon
          -PtestJavaVersion="$TEST_JAVA_VERSION"
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

  # The PostgreSQL versions to test come from endoflife.date too: every major
  # from 15 upward, the oldest the README supports. Each major runs at its
  # newest minor release, or at the minor before it while the newest is
  # younger than seven days, the same wait renovate.json gives every other
  # dependency. A major whose first release is that young joins a week later.
  postgres:
    name: postgres
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - name: List PostgreSQL releases from 15 upward
        id: pick
        run: |
          # Kept by hand; it only runs when endoflife.date fails, and older tags stay pullable.
          fallback='["postgres:15.19","postgres:16.15","postgres:17.11","postgres:18.6"]'
          cutoff=$(date -u -d '7 days ago' +%F)
          images=$(curl -fsS --max-time 20 https://endoflife.date/api/postgresql.json \
            | jq -c --arg cutoff "$cutoff" '
                [.[]
                  | select((.cycle | strings | test("^[0-9]+$")) and (.cycle | tonumber) >= 15)
                  | select(.latest | strings | test("^[0-9]+[.][0-9]+$"))
                  | (.latest | split(".") | map(tonumber)) as [$major, $minor]
                  | if ((.latestReleaseDate | strings) // "9999") <= $cutoff then .latest
                    elif $minor > 0 then "\($major).\($minor - 1)"
                    else empty end]
                | sort_by(split(".") | map(tonumber))
                | map("postgres:" + .)') \
            || images=''
          if [ -z "$images" ] || [ "$images" = '[]' ]; then
            echo "::warning::endoflife.date gave no usable answer, testing the committed list $fallback instead"
            images=$fallback
          fi
          echo "Testing $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  integration:
    name: integration (${{ matrix.image }})
    needs: postgres
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      # As in the build job, every PostgreSQL version reports on its own.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.postgres.outputs.images) }}
    steps:
      # Keeps checkout's hint about 'master' out of the log, as in the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
      - name: Run the integration tests against ${{ matrix.image }}
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: >
          ./gradlew test --no-daemon
          --tests 'ch.fmartin.*IntegrationTest'
          -PtestPostgresImage="$POSTGRES_IMAGE"

  # Replay saved inputs independently so every regression blocks the required check.
  replay:
    name: replay
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Keeps checkout's hint about 'master' out of the log, as in the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
      - name: Restore the corpus from main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-results/**/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Replay saved inputs
        run: ./gradlew fuzzTest --no-daemon

  # Random campaigns report findings without blocking the required test check.
  # Only main saves the corpus, so pull requests cannot change later replay inputs.
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    # FUZZ_DURATION for each @FuzzTest method plus 15 minutes for the build and
    # the replay, so this has to grow with the duration and with every new method.
    timeout-minutes: 20
    env:
      FUZZ_DURATION: 5m
    steps:
      # Keeps checkout's hint about 'master' out of the log, as in the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
      - name: Fuzz each @FuzzTest method for ${{ env.FUZZ_DURATION }}
        run: ./gradlew fuzz --no-daemon -PfuzzDuration="$FUZZ_DURATION"
      # A failing campaign still saves the corpus it built; the failing inputs sit apart from it.
      - name: Save the corpus
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-results/**/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      # ./gradlew fuzz -PfuzzRepro=<file> --tests '<class>.<method>' replays a downloaded input.
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: build/fuzz-results/**/failures
          if-no-files-found: ignore

  # The ruleset on main requires a status check whose context is exactly "test".
  # The matrix legs are named "build (Java N)" and "integration (postgres:N)", so
  # this job carries the name and the combined result of both matrices and the
  # saved-input replay. Without always() it would be skipped when a job fails, and
  # a skipped required check does not block a merge.
  test:
    name: test
    needs: [build, integration, replay]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every Java version, PostgreSQL version and saved-input replay to have passed
        env:
          # For a matrix job this is the aggregate: "success" only when every leg
          # succeeded, otherwise "failure", "cancelled" or "skipped".
          BUILD_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          echo "Java matrix: ${BUILD_RESULT}, PostgreSQL matrix: ${INTEGRATION_RESULT}, replay: ${REPLAY_RESULT}"
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "::error::At least one Java version did not pass (matrix result: ${BUILD_RESULT})."
            exit 1
          fi
          if [ "${INTEGRATION_RESULT}" != "success" ]; then
            echo "::error::At least one PostgreSQL version did not pass (matrix result: ${INTEGRATION_RESULT})."
            exit 1
          fi
          if [ "${REPLAY_RESULT}" != "success" ]; then
            echo "::error::Saved-input replay did not pass (result: ${REPLAY_RESULT})."
            exit 1
          fi
