name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The Java versions to test come from endoflife.date, so a new LTS joins the
  # matrix without a change here. Only LTS releases from 21 upward count: 21 is
  # the toolchain in build.gradle.kts and the minimum the README promises.
  lts:
    name: lts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - name: List current Java LTS versions from 21 upward
        id: pick
        run: |
          fallback='["21","25"]'
          versions=$(curl -fsS --max-time 20 https://endoflife.date/api/eclipse-temurin.json \
            | jq -c '[.[] | select(.lts != false) | .cycle | select((tonumber? // 0) >= 21)] | sort_by(tonumber)') \
            || versions=''
          if [ -z "$versions" ] || [ "$versions" = '[]' ]; then
            echo "::warning::endoflife.date gave no usable answer, testing the committed list $fallback instead"
            versions=$fallback
          fi
          echo "Testing Java $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    name: build (Java ${{ matrix.java }})
    needs: lts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every leg must report on its own; cancelling the rest after one failure
      # would hide which Java versions still work.
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.lts.outputs.versions) }}
    steps:
      # The Ubuntu image leaves init.defaultBranch unset, so the git init inside
      # checkout prints a multi-line hint about 'master'. Setting it here only
      # names the throwaway initial branch; checkout still fetches the PR commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      # The toolchain compiles for 21 on every leg, so 21 has to be installed
      # next to the JDK under test. JAVA_HOME_21_X64 tells Gradle where it is.
      - name: Set up Java 21 for the toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
      - name: Build and run the tests on Java ${{ matrix.java }}
        env:
          TEST_JAVA_VERSION: ${{ matrix.java }}
        run: >
          ./gradlew build --no-daemon
          -PtestJavaVersion="$TEST_JAVA_VERSION"
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

  # Replays the corpus the last run on main saved, then runs a coverage-guided
  # campaign on every @FuzzTest method. A campaign starts from an empty corpus,
  # so the saved one serves as regression inputs only. Only main saves it, so a
  # pull request cannot change what later runs replay.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    # Covers the campaign for each @FuzzTest method plus the build around it.
    timeout-minutes: 20
    env:
      FUZZ_DURATION: 5m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.12"
          cache: gradle
      - name: Restore the corpus from main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-results/**/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Replay the corpus, then fuzz each @FuzzTest method for ${{ env.FUZZ_DURATION }}
        run: ./gradlew fuzzTest fuzz --no-daemon -PfuzzDuration="$FUZZ_DURATION"
      # A failing campaign still saves the corpus it built; the failing inputs sit apart from it.
      - name: Save the corpus
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-results/**/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      # ./gradlew fuzz -PfuzzRepro=<file> --tests '<class>.<method>' replays a downloaded input.
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: build/fuzz-results/**/failures
          if-no-files-found: ignore

  # The ruleset on main requires a status check whose context is exactly "test".
  # The matrix legs are named "build (Java N)", so this job carries the name and
  # the combined result of the matrix and the fuzz job. Without always() it would
  # be skipped when a job fails, and a skipped required check does not block a merge.
  test:
    name: test
    needs: [build, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Java version and the fuzz campaign to have passed
        env:
          # For a matrix job this is the aggregate: "success" only when every leg
          # succeeded, otherwise "failure", "cancelled" or "skipped".
          BUILD_RESULT: ${{ needs.build.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          echo "Matrix result: ${BUILD_RESULT}, fuzz result: ${FUZZ_RESULT}"
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "::error::At least one Java version did not pass (matrix result: ${BUILD_RESULT})."
            exit 1
          fi
          if [ "${FUZZ_RESULT}" != "success" ]; then
            echo "::error::The fuzz campaign did not pass (result: ${FUZZ_RESULT}). The fuzz-failures artifact holds the failing inputs."
            exit 1
          fi
