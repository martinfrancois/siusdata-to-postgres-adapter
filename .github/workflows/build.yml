name: Build

permissions:
  contents: read

on:
  push:

# Only the newest commit on a branch needs a complete build. This is especially
# important on master, where every completed run creates a Windows release.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Verify GraalVM installation
        run: |
          echo "GRAALVM_HOME: $env:GRAALVM_HOME"
          echo "JAVA_HOME: $env:JAVA_HOME"
          java --version
          native-image --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true  # Disable caching here to avoid redundancy with the GraalVM setup

      - name: Build JAR with Gradle
        run: .\gradlew shadowJar --scan

      - name: Build Native Image for Windows
        run: .\gradlew nativeCompile

      - name: Zip Native Executable and DLLs
        run: |
          $zipFile = "build/native/nativeCompile/siusdata-to-postgres-adapter-native-executable.zip"
          Compress-Archive -Path "build/native/nativeCompile/siusdata-to-postgres-adapter*.exe", "build/native/nativeCompile/*.dll" -DestinationPath $zipFile

      - name: Get current date
        id: date
        shell: pwsh
        run: |
          $date = (Get-Date -UFormat "%Y-%m-%dT%H-%M-%SZ")
          echo "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: |
            build/libs/siusdata-to-postgres-adapter*.jar
            build/native/nativeCompile/siusdata-to-postgres-adapter-native-executable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --scan

      - name: Run fuzz tests
        run: ./gradlew jqfFuzz --scan
        env:
          JQF_ZEST_MAX_TIME: 300s

      - name: Upload fuzzing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jqf-artifacts
          path: build/jqf
          if-no-files-found: ignore

      - name: Build with Gradle
        run: ./gradlew build --scan
