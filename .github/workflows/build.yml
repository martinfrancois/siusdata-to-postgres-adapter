name: Build

on:
  push:

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@2a2412009026a83f51d179f92dc2b3fd4c8142df # v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Verify GraalVM installation
        run: |
          echo "GRAALVM_HOME: $env:GRAALVM_HOME"
          echo "JAVA_HOME: $env:JAVA_HOME"
          java --version
          native-image --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5
        with:
          cache-disabled: true  # Disable caching here to avoid redundancy with the GraalVM setup

      - name: Build JAR with Gradle
        run: .\gradlew shadowJar --scan

      - name: Build Native Image for Windows
        run: .\gradlew nativeCompile

      - name: Zip Native Executable and DLLs
        run: |
          $zipFile = "build/native/nativeCompile/siusdata-to-postgres-adapter-native-executable.zip"
          Compress-Archive -Path "build/native/nativeCompile/siusdata-to-postgres-adapter*.exe", "build/native/nativeCompile/*.dll" -DestinationPath $zipFile

      - name: Get current date
        id: date
        shell: pwsh
        run: |
          $date = (Get-Date -UFormat "%Y-%m-%dT%H-%M-%SZ")
          echo "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@aec2ec56f94eb8180ceec724245f64ef008b89f5 # v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: |
            build/libs/siusdata-to-postgres-adapter*.jar
            build/native/nativeCompile/siusdata-to-postgres-adapter-native-executable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@2a2412009026a83f51d179f92dc2b3fd4c8142df # v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          components: 'native-image'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew test --scan

      - name: Build with Gradle
        run: ./gradlew build --scan

      - name: Build native image
        run: ./gradlew nativeCompile --scan
