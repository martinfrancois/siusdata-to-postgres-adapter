name: CI

on:
  pull_request:
    branches: [ master ]
  push:
  workflow_dispatch:

# Default to least-privilege; the release job overrides to contents: write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-native-windows:
    name: Windows Native Check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Validate Gradle Wrapper (supply-chain hardening)
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup GraalVM (Java 21 + native-image)
        uses: graalvm/setup-graalvm@2a2412009026a83f51d179f92dc2b3fd4c8142df # v1
        with:
          distribution: graalvm
          java-version: '21'
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Verify toolchain
        shell: pwsh
        run: |
          echo "GRAALVM_HOME: $env:GRAALVM_HOME"
          echo "JAVA_HOME: $env:JAVA_HOME"
          java --version
          native-image --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5
        with:
          cache-disabled: true  # Disable caching here to avoid redundancy with the GraalVM setup

      - name: Build JAR (shadow)
        shell: pwsh
        run: .\gradlew shadowJar --no-daemon --scan

      - name: Build native image (Windows)
        shell: pwsh
        run: .\gradlew nativeCompile --no-daemon --scan

      - name: Smoke test exe for reflection issues
        shell: pwsh
        env:
          CSV_MONITOR_PATH: ${{ github.workspace }}\build\tmp\csv
          POSTGRESQL_URL: jdbc:postgresql://127.0.0.1:5432/test
          POSTGRESQL_USER: test
          POSTGRESQL_PASSWORD: test
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CSV_MONITOR_PATH" | Out-Null
          $exe = "build\native\nativeCompile\siusdata-to-postgres-adapter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Missing exe at $exe"; exit 1 }
          $out = "native_stdout.txt"
          $err = "native_stderr.txt"
          $p = Start-Process -FilePath $exe -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

          $stdout = Get-Content $out -Raw
          $stderr = Get-Content $err -Raw

          if ($stdout -match "MissingReflectionRegistrationError" -or $stderr -match "MissingReflectionRegistrationError") {
            Write-Error "GraalVM reflection metadata missing"
            Write-Host $stdout
            Write-Host $stderr
            exit 1
          }

          if (($stdout + $stderr) -notmatch "HikariConfig - .*configuration") {
            Write-Error "Startup path not exercised to Hikari config"
            Write-Host $stdout
            Write-Host $stderr
            exit 1
          }

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-logs
          path: |
            native_stdout.txt
            native_stderr.txt
          retention-days: 14

      # Only package + upload artifacts on push to master
      - name: Zip Native Executable and DLLs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $zipFile = "build/native/nativeCompile/siusdata-to-postgres-adapter-native-executable.zip"
          Compress-Archive -Force -Path "build/native/nativeCompile/siusdata-to-postgres-adapter*.exe","build/native/nativeCompile/*.dll" -DestinationPath $zipFile

      - name: Upload native zip artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: native-zip
          path: build/native/nativeCompile/siusdata-to-postgres-adapter-native-executable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload JAR artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: shadow-jar
          path: build/libs/siusdata-to-postgres-adapter*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release on master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-native-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download native zip artifact
        uses: actions/download-artifact@v4
        with:
          name: native-zip
          path: dist

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: dist

      - name: Get current date
        id: date
        shell: bash
        run: echo "date=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@aec2ec56f94eb8180ceec724245f64ef008b89f5 # v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          fail_on_unmatched_files: true
          files: |
            dist/siusdata-to-postgres-adapter*.jar
            dist/siusdata-to-postgres-adapter-native-executable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5
      - name: Run unit tests
        run: ./gradlew test --no-daemon --scan
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --scan
