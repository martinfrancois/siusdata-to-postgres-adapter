name: GraalVM build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the repository
      - uses: actions/checkout@v4

      # Step 2: Set up GraalVM with Java 21
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'      # Java 21 with GraalVM
          distribution: 'graalvm' # GraalVM distribution
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Verify GraalVM setup
      - name: Verify GraalVM installation
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      # Step 4: Build the native image using Gradle with cross-compilation for Windows
      - name: Build Native Image for Windows
        run: |
          ./gradlew nativeCompile

      # Step 5: Upload the native image artifact (Windows binary)
      - name: Upload Native Image Artifact
        uses: actions/upload-artifact@v3
        with:
          name: native-windows-image
          path: build/native/nativeCompile/*
