name: Build

on:
  push: # Trigger for all branches
  pull_request:

jobs:
  release-jar:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew shadowJar --scan

      # Get current date for GitHub release
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date --utc +%Y-%m-%dT%H-%M-%SZ)"

      # Create GitHub Release and Upload Artifact
      - name: Create GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: ./build/libs/siusdata-to-postgres-adapter*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-native:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'      # Java 21 with GraalVM
          distribution: 'graalvm' # GraalVM distribution
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Verify GraalVM installation
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Build Native Image for Windows
        run: |
          ./gradlew nativeCompile

      # Upload Native Image Artifact to the release
      - name: Upload Native Image Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }} # Same tag as in release-jar job
          name: Release ${{ steps.date.outputs.date }} # Same release name
          files: build/native/nativeCompile/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --scan

      - name: Build with Gradle
        run: ./gradlew shadowJar --scan