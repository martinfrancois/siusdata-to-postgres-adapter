# Only classes annotated with @Execution(CONCURRENT) run their tests in parallel; everything else stays sequential.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
# Each concurrent integration test starts its own PostgreSQL and Toxiproxy container, so a fixed
# limit keeps a machine with many cores from starting dozens of containers at once.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
